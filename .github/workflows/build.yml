name: Build APK

# Builds a signed APK on every push to main, or by hand from the Actions tab.
# It needs two repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_B64       your keystore file, base64 encoded
#   KEYSTORE_PASSWORD  the password of the keystore and of the key
# Step by step: docs/BUILD.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The original repository has no signing key (nobody can use mine), so it does not build.
    # Your fork or copy has a different name and builds.
    if: github.repository != 'SpeakingColors/StarDriftTvLauncher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "The KEYSTORE_B64 and KEYSTORE_PASSWORD secrets are missing."
            echo "Create them first: see docs/BUILD.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tvlauncher.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/tvlauncher.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Show the signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee cert.txt
          # Optional: set a repository variable EXPECTED_CERT_SHA256 to the SHA-256 of your key
          # and the build fails if a different key is ever used (a TV refuses updates signed with another key).
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            grep -qi "$EXPECTED_CERT_SHA256" cert.txt || { echo "WRONG SIGNING KEY"; exit 1; }
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/tvlauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvlauncher-apk
          path: out/tvlauncher.apk

      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/tvlauncher.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Build from commit ${GITHUB_SHA::7}."
